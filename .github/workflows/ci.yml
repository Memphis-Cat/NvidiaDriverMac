name: CI

on:
  push:
  pull_request:

jobs:
  windows-core:
    name: Windows portable core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        # The portable tests intentionally use assert() for their contracts.
        # A Release build defines NDEBUG and silently removes those checks.
        run: ctest --test-dir build -C Debug --output-on-failure

  tahoe-driverkit:
    name: macOS 26 Intel DriverKit + host compile
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile DriverKit extension without signing
        run: |
          xcodebuild \
            -project NvidiaDriverMac.xcodeproj \
            -target RTXMac \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Compile host app without signing
        run: |
          xcodebuild \
            -project NvidiaDriverMac.xcodeproj \
            -target RTXMacHost \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
